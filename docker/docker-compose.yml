name: inno-practice-python

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?Задайте DB_NAME в .env.local}
      POSTGRES_USER: ${DB_USER:?Задайте DB_USER в .env.local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env.local}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ../data:/app/data:ro
      - ../output:/app/output
    command: ["--format", "${FORMAT:-json}"]

volumes:
  pgdata: